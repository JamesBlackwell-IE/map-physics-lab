<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAP Physics Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      margin-bottom: 0.2em;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 22px;
      margin-top: 20px;
    }

    .card h2 {
      margin-top: 0;
    }

    a.button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    a.button:hover {
      background: #444;
    }

    footer {
      margin-top: 50px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <h1>MAP Physics Lab</h1>

  <p class="subtitle">
    Interactive physics simulations for Medical Applications of Physics.
  </p>

  <div class="card">
    <h2>Effective Weight in a Lift</h2>

    <p>
      Explore how acceleration changes apparent weight and the force measured
      by a weighing scale inside a lift.
    </p>

    <a class="button" href="effective-weight/">
      Launch simulator
    </a>
  </div>

  <footer>
    James Blackwell | Medical Physics
  </footer>

</body>
</html>
